# Pubblica il servizio prezzi su Cloudflare Workers. Richiede i secret CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.
name: Worker prezzi
on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
